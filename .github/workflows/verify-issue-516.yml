name: Verify Issue 516 Fix

on:
  workflow_dispatch:

jobs:
  cc-tests:
    name: C++ partition-selection tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Ensure bazelisk is installed
        run: bazelisk --version
      - name: 'bazel test //cc/algorithms:partition-selection_test (repo root)'
        run: bazelisk test --test_output=errors //cc/algorithms:partition-selection_test
      - name: 'bazel test //cc/algorithms/... (repo root)'
        run: bazelisk test --test_output=errors --test_timeout_filters=-long,-eternal //cc/algorithms/...
      - name: Fallback - cc workspace equivalents
        if: failure()
        working-directory: cc
        run: |
          bazelisk test --test_output=errors //algorithms:partition-selection_test
          bazelisk test --test_output=errors --test_timeout_filters=-long,-eternal //algorithms/...
