name: Verify Issue 516 Fix

on:
  workflow_dispatch:

jobs:
  cc-tests:
    name: C++ partition-selection tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Ensure bazelisk is installed
        run: bazelisk --version
      - name: 'bazel test //algorithms:partition-selection_test (cc workspace)'
        working-directory: cc
        run: bazelisk test --test_output=errors //algorithms:partition-selection_test
      - name: 'bazel test //algorithms/... (cc workspace)'
        working-directory: cc
        run: bazelisk test --test_output=errors --test_timeout_filters=-long,-eternal //algorithms/...
